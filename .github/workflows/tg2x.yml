name: tg2x

# GitHub 的定时任务最快 5 分钟一次，且高峰期会被延迟 5-20 分钟。
# 想更实时就得换常驻方案（见 DEPLOY.md 最后一节）。
on:
  schedule:
    # 每 30 分钟一轮，每轮只搬最新 1 条。
    # 注意：GitHub 的定时任务是「尽力而为」，高峰期会延迟甚至漏跑，不能保证准点。
    - cron: "*/30 * * * *"
  # 备用触发：外部定时器（cron-job.org 等）POST 到 dispatches 端点，秒级准点、不排队。
  repository_dispatch:
    types: [run]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只跑不发（dry run），用来验证链路"
        type: boolean
        default: false

permissions:
  contents: write

# 防止两次运行叠在一起（叠起来会重复发文）
concurrency:
  group: tg2x
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 恢复去重状态
        uses: actions/cache/restore@v4
        with:
          path: |
            data/tg2x.sqlite3
            data/buffer_channel.json
          key: tg2x-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tg2x-state-

      - name: 跑一轮
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TZ: Asia/Shanghai
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p data
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "== dry run =="
            python run.py once --dry-run
          else
            python run.py once
          fi

      - name: 保存去重状态
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/tg2x.sqlite3
            data/buffer_channel.json
          key: tg2x-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 推送中文原文（供本机国内分发）
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cn_feed.json
          if git diff --cached --quiet; then
            echo "cn_feed.json 无变化，跳过提交"
          else
            git commit -m "chore: update cn feed"
            git push
          fi

      - name: 失败时把日志尾部打到输出里
        if: failure()
        run: tail -n 60 data/tg2x.log || true
